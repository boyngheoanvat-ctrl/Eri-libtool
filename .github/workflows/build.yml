name: Build EriLibtool
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git build-essential curl unzip \
            libcurl4-openssl-dev libzip-dev \
            gcc-multilib g++-multilib

      - name: Setup Theos
        run: |
          export THEOS=$GITHUB_WORKSPACE/theos
          # ✅ Clone WITH submodules = vendor/ included immediately
          git clone --recursive --depth=1 https://github.com/theos/theos.git "$THEOS"
          # ✅ Export THEOS to GitHub env for all subsequent steps
          echo "THEOS=$THEOS" >> $GITHUB_ENV

      - name: Install iOS SDKs
        run: |
          mkdir -p "$THEOS/sdks" && cd "$THEOS/sdks"
          curl -fsSL https://github.com/theos/sdks/archive/refs/heads/master.zip -o sdks.zip
          unzip -q sdks.zip
          mv sdks-master/*.sdk ./
          rm -rf sdks-master sdks.zip sdks.zip
          ls -la  # Verify SDKs exist

      - name: Build
        run: |
          make clean
          make DEBUG=0
