name: Build Android Library

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y \
            build-essential cmake git curl wget zip unzip xz-utils

      - name: Create Missing Header Folders & Files
        run: |
          mkdir -p Il2cpp Includes Menu Tool imgui nlohmann

          cat << 'EOF' > Includes/Logger.h
          #pragma once
          #include <cstdio>
          #define LOGD(...) ((void)0)
          namespace logger { inline void Clear() {} }
          EOF

          cat << 'EOF' > Includes/Utils.h
          #pragma once
          EOF

          cat << 'EOF' > Includes/obfuscate.h
          #pragma once
          #define OBFUSCATE(x) x
          EOF

          cat << 'EOF' > nlohmann/json.hpp
          #pragma once
          #include <string>
          namespace nlohmann {
              class ordered_json {
              public:
                  std::string dump(int w, char f) { return ""; }
              };
          }
          EOF

          cat << 'EOF' > Il2cpp/Il2cpp.h
          #pragma once
          #include <vector>
          #include <string>
          struct Il2CppImage {};
          struct MethodInfo {
              void* getClass();
          };
          struct HookerData {
              static inline std::vector<HookerData> visited;
              std::string name;
              int hitCount = 0;
              float time = 0;
              float goneTime = 0;
              void* method = nullptr;
          };
          namespace NovaProxy {
              enum class LogLevel { INFO, DEBUG, ERR };
              class ProxyUtils {
              public:
                  static void ConsoleInit() {}
                  static void Log(std::string msg, LogLevel level) {}
                  static bool LoadConfig(std::string path) { return true; }
                  static bool InterceptTrafficPattern(std::string p) { return true; }
              };
          }
          EOF

          cat << 'EOF' > Il2cpp/il2cpp-class.h
          #pragma once
          EOF

          cat << 'EOF' > imgui/imgui.h
          #pragma once
          #include <string>
          struct ImVec2 {
              float x, y;
              ImVec2(float _x=0, float _y=0) : x(_x), y(_y) {}
          };
          struct ImVec4 {
              float x, y, z, w;
          };
          struct ImGuiStyle {};
          struct ImGuiIO {
              ImVec2 DisplaySize;
              float DeltaTime;
          };
          namespace ImGui {
              inline ImGuiIO& GetIO() { static ImGuiIO io; return io; }
              inline void SetNextWindowPos(const ImVec2& pos, int cond = 0, const ImVec2& pivot = ImVec2(0,0)) {}
              inline void SetNextWindowSize(const ImVec2& size, int cond = 0) {}
              inline void PushStyleVar(int idx, float val) {}
              inline void PushStyleVar(int idx, ImVec2 val) {}
              inline void PopStyleVar(int count = 1) {}
              inline auto GetBackgroundDrawList() { struct DL {
                  void AddRectFilled(ImVec2 a, ImVec2 b, unsigned int col) {}
                  void AddText(ImVec2 pos, unsigned int col, const char* text) {}
              }; static DL dl; return &dl; }
              inline bool Begin(const char* name, bool* p_open = nullptr, int flags = 0) { return true; }
              inline void End() {}
              inline void PushID(const void* int_id) {}
              inline void PopID() {}
              inline bool Checkbox(const char* label, bool* v) { return false; }
              inline bool BeginTabBar(const char* str_id, int flags = 0) { return true; }
              inline void EndTabBar() {}
              inline bool BeginTabItem(const char* label, bool* p_open = nullptr, int flags = 0) { return true; }
              inline void EndTabItem() {}
              inline bool Button(const char* label, ImVec2 size = ImVec2(0,0)) { return false; }
              inline void OpenPopup(const char* str_id, int flags = 0) {}
              inline ImVec2 CalcTextSize(const char* text, const char* text_end = nullptr, bool hide_text_after_double_hash = false, float wrap_width = -1.0f) { return ImVec2(10,10); }
              inline void BeginChild(const char* str_id, ImVec2 size = ImVec2(0,0), bool border = false, int flags = 0) {}
              inline void EndChild() {}
              inline void Text(const char* fmt, ...) {}
              inline bool IsItemHeld() { return false; }
          }
          inline float ImLerp(float a, float b, float t) { return a + (b - a) * t; }
          constexpr int ImGuiWindowFlags_NoResize = 1;
          constexpr int ImGuiWindowFlags_NoMove = 2;
          constexpr int ImGuiWindowFlags_HorizontalScrollbar = 4;
          constexpr int ImGuiStyleVar_FramePadding = 0;
          constexpr int ImGuiTabItemFlags_SetSelected = 1;
          EOF

          cat << 'EOF' > imgui/imgui_internal.h
          #pragma once
          EOF

          cat << 'EOF' > Menu/ImGui.h
          #pragma once
          #include "../imgui/imgui.h"
          inline void initModMenu(void*, void*) {}
          EOF

          cat << 'EOF' > Tool/Keyboard.h
          #pragma once
          namespace Keyboard { inline void Update() {} }
          EOF

          cat << 'EOF' > Tool/Tool.h
          #pragma once
          struct TabView {
              bool MethodViewer(void*, void*, void*) { return true; }
              void* getCachedParams(void*) { return nullptr; }
          };
          namespace Tool {
              inline void Draw() {}
              inline TabView& GetFirstTab() { static TabView t; return t; }
              inline TabView& OpenNewTabFromClass(void*) { static TabView t; return t; }
          }
          EOF

          cat << 'EOF' > Tool/Util.h
          #pragma once
          EOF

          cat << 'EOF' > Tool/Unity.h
          #pragma once
          EOF

          cat << 'EOF' > utils.h
          #pragma once
          EOF

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r26b
          add-to-path: true

      - name: Configure CMake
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="${{ steps.setup-ndk.outputs.ndk-path }}/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI="arm64-v8a" \
            -DANDROID_PLATFORM="android-21"

      - name: Build Project
        run: cmake --build build --config Release

      - name: Upload .so Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-mod-library
          path: build/*.so
          retention-days: 7
