      - name: Create Missing Header Folders & Files
        run: |
          mkdir -p Il2cpp Includes Menu Tool imgui
          
          # Tạo header giả lập cho NovaProxy
          echo -n '#pragma once
          #include <string>
          namespace NovaProxy {
              enum class LogLevel { INFO, DEBUG, ERR };
              class ProxyUtils {
              public:
                  static void ConsoleInit() {}
                  static void Log(std::string msg, LogLevel level) {}
                  static bool LoadConfig(std::string path) { return true; }
                  static bool InterceptTrafficPattern(std::string p) { return true; }
              };
          }' > Includes/NovaProxy.h

          # Tạo header nlohmann json giả lập
          mkdir -p nlohmann
          echo -n '#pragma once
          #include <string>
          namespace nlohmann {
              class ordered_json {
              public:
                  std::string dump(int w, char f) { return ""; }
              };
          }' > nlohmann/json.hpp

          # Tạo các header cho Il2cpp và ImGui
          echo -n '#pragma once
          struct Il2CppImage {};
          struct MethodInfo {
              void* getClass();
          };
          struct HookerData {
              static inline std::vector<HookerData> visited;
              std::string name;
              int hitCount = 0;
              float time = 0;
              float goneTime = 0;
              void* method = nullptr;
          };
          ' > Il2cpp/Il2cpp.h
          touch Il2cpp/il2cpp-class.h

          echo -n '#pragma once
          #include <string>
          #include <vector>
          #include <unordered_map>
          inline std::unordered_map<void*, HookerData> hookerMap;
          inline int maxLine = 0;
          struct ImVec2 { float x, y; ImVec2(float x=0, float y=0):x(x),y(y){} };
          inline ImVec2 initialScreenSize;
          inline void initModMenu(void*, void*) {}
          ' > Menu/ImGui.h

          touch Includes/Logger.h Includes/Utils.h Includes/obfuscate.h
          touch Tool/Keyboard.h Tool/Tool.h Tool/Util.h Tool/Unity.h
          touch imgui/imgui.h imgui/imgui_internal.h utils.h
          
          echo "#pragma once" > Includes/Logger.h
          echo "#define LOGD(...) ((void)0)" >> Includes/Logger.h
          echo "#define OBFUSCATE(x) x" > Includes/obfuscate.h
