name: Build All Platforms

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android (.so)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Prepare Mock Directories and Files
        run: |
          mkdir -p Il2cpp Includes Menu Tool imgui nlohmann jni android
          touch Il2cpp/il2cpp-class.h Includes/Utils.h Tool/Tool.h Tool/Util.h Tool/Unity.h utils.h imgui/imgui_internal.h jni/jni.h

          if [ ! -f "eri.h" ]; then
            cat << 'EOF' > eri.h
          #pragma once
          #include <string>
          #include <vector>
          #include <unordered_map>

          #define OBFUSCATE(x) x
          #define LOGD(...) ((void)0)

          namespace logger {
              inline void Clear() {}
          }

          namespace NovaProxy {
              #undef DEBUG
              enum class LogLevel { INFO, DEBUG, ERR };
              class ProxyUtils {
              public:
                  static void ConsoleInit() {}
                  static void Log(std::string msg, LogLevel level) {}
                  static bool LoadConfig(std::string path) { return true; }
                  static bool InterceptTrafficPattern(std::string p) { return true; }
              };
          }

          namespace nlohmann {
              class ordered_json {
              public:
                  template<typename... Args>
                  ordered_json(Args&&...) {}
                  std::string dump(int w = 0, char f = ' ') { return ""; }
              };
          }

          struct Il2CppImage {};
          struct MethodInfo { void* getClass() { return nullptr; } };
          struct HookerData {
              static inline std::vector<HookerData> visited;
              std::string name;
              int hitCount = 0;
              float time = 0;
              float goneTime = 0;
              MethodInfo* method = nullptr;
          };

          struct ImVec2 { float x, y; ImVec2(float x=0, float y=0):x(x),y(y){} };
          struct ImVec4 { float x, y, z, w; };
          struct ImGuiStyle {};
          struct ImColor {
              ImColor(float, float, float, float) {}
              ImColor(unsigned int) {}
              ImVec4 Value = {1,1,1,1};
          };
          struct ImDrawList {
              void AddRectFilled(ImVec2, ImVec2, unsigned int, float = 0.0f, int = 0) {}
              void AddText(ImVec2, ImColor, const char*) {}
          };
          struct ImGuiIO {
              ImVec2 DisplaySize = {1920, 1080};
              float DeltaTime = 0.016f;
          };
          inline float ImLerp(float a, float b, float t) { return a + (b - a) * t; }

          #define IM_COL32(r,g,b,a) (0)
          #define ImGuiStyleVar_FramePadding 0
          #define ImGuiChildFlags_None 0
          #define ImGuiWindowFlags_NoResize (1 << 0)
          #define ImGuiWindowFlags_NoMove (1 << 1)
          #define ImGuiWindowFlags_HorizontalScrollbar (1 << 2)
          #define ImGuiTabItemFlags_SetSelected (1 << 0)

          namespace ImGui {
              inline ImGuiIO& GetIO() { static ImGuiIO io; return io; }
              inline ImDrawList* GetBackgroundDrawList() { static ImDrawList list; return &list; }
              inline void SetNextWindowPos(ImVec2, int = 0, ImVec2 = ImVec2()) {}
              inline void SetNextWindowSize(ImVec2, int = 0) {}
              inline void PushStyleVar(int, ImVec2) {}
              inline void PopStyleVar(int = 1) {}
              inline ImVec2 CalcTextSize(const char*) { return ImVec2(); }
              inline bool Begin(const char*, bool* = nullptr, int = 0) { return true; }
              inline void End() {}
              inline void PushStyleColor(int, unsigned int) {}
              inline void PopStyleColor(int = 1) {}
              inline bool Checkbox(const char*, bool*) { return false; }
              inline bool Checkbox(const char*, bool* v) { return false; }
              inline void OpenPopup(const char*) {}
              inline void BeginChild(const char*, ImVec2, bool = false, int = 0) {}
              inline void EndChild() {}
              inline void PushID(void*) {}
              inline void PopID() {}
              inline bool IsItemHeld() { return false; }
              inline bool BeginTabBar(const char*, int = 0) { return false; }
              inline void EndTabBar() {}
              inline bool BeginTabItem(const char*, bool* = nullptr, int = 0) { return false; }
              inline bool EndTabItem() { return; }
              inline bool Text(const char*, ...) { return false; }
              inline bool Button(const char*) { return false; }
              inline float GetFrameHeight() { return 0.f; }
              inline ImVec2 GetWindowSize() { return ImVec2(); }
              inline ImVec2 GetWindowPos() { return ImVec2(); }
          }

          inline std::unordered_map<void*, HookerData> hookerMap;
          inline int maxLine = 0;
          inline ImVec2 initialScreenSize;
          inline void initModMenu(void*, void*) {}
          struct Tool {
              static void Draw() {}
              struct Tab {
                  bool MethodViewer(void*, void*, void*) { return true; }
                  void* getCachedParams(void*) { return nullptr; }
                  bool setOpenedTab = false;
              };
              static Tab& GetFirstTab() { static Tab t; return t; }
              static Tab& OpenNewTabFromClass(void*) { static Tab t; return t; }
          };

          struct Keyboard {
              static void Update() {}
          };
          EOF
          fi

          echo '#pragma once' > Includes/NovaProxy.h
          echo '#include "../eri.h"' >> Includes/NovaProxy.h
          echo '#pragma once' > nlohmann/json.hpp
          echo '#include "../eri.h"' >> nlohmann/json.hpp
          echo '#pragma once' > Il2cpp/Il2cpp.h
          echo '#include "../eri.h"' >> Il2cpp/Il2cpp.h
          echo '#pragma once' > imgui/imgui.h
          echo '#include "../eri.h"' >> imgui/imgui.h
          echo '#pragma once' > Menu/ImGui.h
          echo '#include "../eri.h"' >> Menu/ImGui.h
          echo '#pragma once' > Tool/Keyboard.h
          echo '#include "../eri.h"' >> Tool/Keyboard.h
          echo '#pragma once' > Includes/Logger.h
          echo '#include "../eri.h"' >> Includes/Logger.h
          echo '#pragma once' > Includes/obfuscate.h
          echo '#include "../eri.h"' >> Includes/obfuscate.h

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r26b
          add-to-path: true

      - name: Configure CMake
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="${{ steps.setup-ndk.outputs.ndk-path }}/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI="arm64-v8a" \
            -DANDROID_PLATFORM="android-21"

      - name: Build Project
        run: cmake --build build --config Release

      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-mod-library
          path: build/*.so
          retention-days: 7

  build-ios:
    name: Build iOS (.deb)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup Theos
        run: |
          git clone --depth=1 --recursive https://github.com/theos/theos.git "$GITHUB_WORKSPACE/theos"
          echo "THEOS=$GITHUB_WORKSPACE/theos" >> $GITHUB_ENV

      - name: Install Linux Toolchain
        run: |
          cd "$GITHUB_WORKSPACE/theos"
          curl -sL https://github.com/L1ghtmann/llvm-project/releases/latest/download/iOSToolchain-x86_64.tar.xz | tar -xJvf - -C toolchain/

      - name: Download SDK
        run: |
          mkdir -p "$THEOS/sdks"
          cd "$THEOS/sdks"
          curl -LO https://github.com/theos/sdks/archive/refs/heads/master.zip
          unzip -q master.zip
          mv sdks-master/*.sdk ./
          rm -rf master.zip sdks-master
          echo "THEOS_SDK=iPhoneOS15.6.sdk" >> $GITHUB_ENV

      - name: Build iOS Tweak
        run: |
          if ! grep -q "#include <array>" Main.cpp; then
            sed -i '1i #include <array>' Main.cpp
          fi

          # Tự động ẩn dòng #include <jni.h> nếu biên dịch trên nền tảng iOS (không dùng jni)
          sed -i 's/#include <jni.h>/\/\/#include <jni.h>/g' Main.cpp

          if [ ! -f "Makefile" ]; then
            cat << 'EOF' > Makefile
          TARGET := iphone:clang:latest:14.0
          ARCHS := arm64 arm64e

          include $(THEOS)/makefiles/common.mk

          TWEAK_NAME := EriLibtool

          EriLibtool_FILES = Main.cpp
          EriLibtool_CFLAGS = -fobjc-arc -std=c++17 -Wno-error=deprecated-declarations -Wno-error=return-type -I./ -I./Includes -I./Menu -I./Il2cpp -I./imgui -I./jni

          include $(THEOS_MAKE_PATH)/tweak.mk
          EOF
          fi

          if [ ! -f "control" ]; then
            cat << 'EOF' > control
          Package: com.example.erilibtool
          Name: EriLibtool
          Depends: mobilesubstrate
          Version: 0.0.1
          Architecture: iphoneos-arm
          Description: An awesome iOS tweak!
          Maintainer: Developer
          Author: Developer
          Section: Tweaks
          EOF
          fi

          export THEOS="$GITHUB_WORKSPACE/theos"
          make package

      - name: Upload DEB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-tweak-deb
          path: packages/*.deb
          retention-days: 7
