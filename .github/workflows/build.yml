name: Build Android Library

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y \
            build-essential cmake git curl wget zip unzip xz-utils

      - name: Create Missing Header Folders & Files
        run: |
          # Tạo các thư mục và header giả lập để code không bị lỗi thiếu file khi biên dịch
          mkdir -p Il2cpp Includes Menu Tool imgui
          touch Il2cpp/Il2cpp.h Il2cpp/il2cpp-class.h
          touch Includes/Logger.h Includes/Utils.h Includes/obfuscate.h
          touch Menu/ImGui.h
          touch Tool/Keyboard.h Tool/Tool.h Tool/Util.h Tool/Unity.h
          touch imgui/imgui.h imgui/imgui_internal.h utils.h
          
          # Nội dung cơ bản chống lỗi trống header (nếu cần)
          echo "#pragma once" > Includes/Logger.h
          echo "#define LOGD(...)" >> Includes/Logger.h
          echo "#define OBFUSCATE(x) x" > Includes/obfuscate.h

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r26b
          add-to-path: true

      - name: Configure CMake
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="${{ steps.setup-ndk.outputs.ndk-path }}/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI="arm64-v8a" \
            -DANDROID_PLATFORM="android-21"

      - name: Build Project
        run: cmake --build build --config Release

      - name: Upload .so Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-mod-library
          path: build/*.so
          retention-days: 7
