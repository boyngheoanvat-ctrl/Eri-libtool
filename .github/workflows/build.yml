name: Build EriLibtool
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git build-essential \
            libcurl4-openssl-dev libzip-dev bsdmainutils \
            gcc-multilib g++-multilib  # Critical for cross-compile

      - name: Setup Theos
        run: |
          git clone --depth=1 https://github.com/theos/theos.git $GITHUB_WORKSPACE/theos
          echo "THEOS=$GITHUB_WORKSPACE/theos" >> $GITHUB_ENV

      - name: Build
        run: |
          export THEOS=$GITHUB_WORKSPACE/theos
          make clean
          make DEBUG=0
