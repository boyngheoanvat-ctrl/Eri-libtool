name: Build EriLibtool
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git build-essential curl unzip xz-utils \
            libcurl4-openssl-dev libzip-dev \
            gcc-multilib g++-multilib

      - name: Setup Theos
        run: |
          export THEOS=$GITHUB_WORKSPACE/theos
          git clone --recursive --depth=1 https://github.com/theos/theos.git "$THEOS"
          echo "THEOS=$THEOS" >> $GITHUB_ENV

      # ✅ CORRECT TOOLCHAIN SOURCE — from sbingner/llvm-project (official)
      - name: Install Theos Linux iOS toolchain
        run: |
          cd "$THEOS"
          curl -fsSL https://github.com/sbingner/llvm-project/releases/latest/download/linux-ios-arm64e-clang-toolchain.tar.lzma -o toolchain.tar.lzma
          tar --lzma -xf toolchain.tar.lzma
          mkdir -p toolchain/linux
          mv ios-arm64e-clang-toolchain toolchain/linux/iphone
          rm toolchain.tar.lzma
          ls -la toolchain/linux/iphone/bin/clang  # Verify

      - name: Install iOS SDKs
        run: |
          mkdir -p "$THEOS/sdks" && cd "$THEOS/sdks"
          curl -fsSL https://github.com/theos/sdks/archive/refs/heads/master.zip -o sdks.zip
          unzip -q sdks.zip
          mv sdks-master/*.sdk ./
          rm -rf sdks-master sdks.zip

      - name: Build
        run: |
          make clean
          make DEBUG=0
