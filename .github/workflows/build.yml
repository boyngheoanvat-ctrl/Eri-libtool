name: Build All Platforms

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android (.so)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r26b
          add-to-path: true

      - name: Configure CMake
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="${{ steps.setup-ndk.outputs.ndk-path }}/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI="arm64-v8a" \
            -DANDROID_PLATFORM="android-21"

      - name: Build Project
        run: cmake --build build --config Release

      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-mod-library
          path: build/*.so
          retention-days: 7

  build-ios:
    name: Build iOS (.deb)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup Theos
        run: |
          git clone --depth=1 --recursive https://github.com/theos/theos.git "$GITHUB_WORKSPACE/theos"
          echo "THEOS=$GITHUB_WORKSPACE/theos" >> $GITHUB_ENV

      - name: Install Linux Toolchain
        run: |
          cd "$GITHUB_WORKSPACE/theos"
          curl -sL https://github.com/L1ghtmann/llvm-project/releases/latest/download/iOSToolchain-x86_64.tar.xz | tar -xJvf - -C toolchain/

      - name: Download SDK
        run: |
          mkdir -p "$THEOS/sdks"
          cd "$THEOS/sdks"
          curl -LO https://github.com/theos/sdks/archive/refs/heads/master.zip
          unzip -q master.zip
          mv sdks-master/*.sdk ./
          rm -rf master.zip sdks-master
          echo "THEOS_SDK=iPhoneOS15.6.sdk" >> $GITHUB_ENV

      - name: Build iOS Tweak
        run: |
          if ! grep -q "#include <array>" Main.cpp; then
            sed -i '1i #include <array>' Main.cpp
          fi

          if [ ! -f "Makefile" ]; then
            cat << 'EOF' > Makefile
          TARGET := iphone:clang:latest:14.0
          ARCHS := arm64 arm64e

          include $(THEOS)/makefiles/common.mk

          TWEAK_NAME := EriLibtool

          EriLibtool_FILES = Main.cpp
          EriLibtool_CFLAGS = -fobjc-arc -std=c++17 -Wno-error=deprecated-declarations -Wno-error=return-type -I./ -I./Includes -I./Menu -I./Il2cpp -I./imgui -I./jni

          include $(THEOS_MAKE_PATH)/tweak.mk
          EOF
          fi

          if [ ! -f "control" ]; then
            cat << 'EOF' > control
          Package: com.example.erilibtool
          Name: EriLibtool
          Depends: mobilesubstrate
          Version: 0.0.1
          Architecture: iphoneos-arm
          Description: An awesome iOS tweak!
          Maintainer: Developer
          Author: Developer
          Section: Tweaks
          EOF
          fi

          export THEOS="$GITHUB_WORKSPACE/theos"
          make package

      - name: Upload DEB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-tweak-deb
          path: packages/*.deb
          retention-days: 7
