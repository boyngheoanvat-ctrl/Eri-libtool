name: Build All Platforms

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android (.so)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y \
            build-essential cmake git curl wget zip unzip xz-utils

      - name: Ensure Directories and Mock Headers
        run: |
          mkdir -p Il2cpp Includes Menu Tool imgui nlohmann jni
          touch Il2cpp/Il2cpp.h Il2cpp/il2cpp-class.h Includes/NovaProxy.h nlohmann/json.hpp imgui/imgui.h imgui/imgui_internal.h Includes/Logger.h Includes/Utils.h Includes/obfuscate.h Tool/Tool.h Tool/Util.h Tool/Unity.h utils.h jni/jni.h

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r26b
          add-to-path: true

      - name: Configure CMake
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="${{ steps.setup-ndk.outputs.ndk-path }}/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI="arm64-v8a" \
            -DANDROID_PLATFORM="android-21"

      - name: Build Project
        run: cmake --build build --config Release

      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-mod-library
          path: build/*.so
          retention-days: 7

  build-ios:
    name: Build iOS (.deb)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y \
            build-essential git perl libssl-dev curl wget zip unzip xz-utils libtinfo6

      - name: Setup Theos
        run: |
          git clone --depth=1 --recursive https://github.com/theos/theos.git "$GITHUB_WORKSPACE/theos"
          echo "THEOS=$GITHUB_WORKSPACE/theos" >> $GITHUB_ENV

      - name: Install Linux Toolchain
        run: |
          cd "$GITHUB_WORKSPACE/theos"
          curl -sL https://github.com/L1ghtmann/llvm-project/releases/latest/download/iOSToolchain-x86_64.tar.xz | tar -xJvf - -C toolchain/

      - name: Download SDK
        run: |
          mkdir -p "$THEOS/sdks"
          cd "$THEOS/sdks"
          curl -LO https://github.com/theos/sdks/archive/refs/heads/master.zip
          unzip -q master.zip
          mv sdks-master/*.sdk ./
          rm -rf master.zip sdks-master
          echo "THEOS_SDK=iPhoneOS15.6.sdk" >> $GITHUB_ENV

      - name: Auto-Patch and Build iOS Tweak
        run: |
          mkdir -p Il2cpp Includes Menu Tool imgui nlohmann jni android

          # Tạo các file mock header cơ bản
          touch Il2cpp/il2cpp-class.h Includes/Utils.h Tool/Tool.h Tool/Util.h Tool/Unity.h utils.h imgui/imgui_internal.h

          cat << 'EOF' > jni/jni.h
          #pragma once
          #ifndef JNI_H
          #define JNI_H
          typedef void* JNIEnv;
          typedef void* jobject;
          typedef void* jclass;
          typedef void* jstring;
          #endif
          EOF

          cat << 'EOF' > android/native_window_jni.h
          #pragma once
          #ifndef NATIVE_WINDOW_JNI_H
          #define NATIVE_WINDOW_JNI_H
          #endif
          EOF

          # Tự động vô hiệu hóa các lệnh include jni đặc thù của Android trong Main.cpp khi build iOS
          sed -i 's/#include <jni.h>/\/\/#include <jni.h>/g' Main.cpp
          sed -i 's/#include <android\/native_window_jni.h>/\/\/#include <android\/native_window_jni.h>/g' Main.cpp

          # Đảm bảo Makefile chuẩn cho Theos
          cat << 'EOF' > Makefile
          TARGET := iphone:clang:latest:14.0
          ARCHS := arm64 arm64e

          include $(THEOS)/makefiles/common.mk

          TWEAK_NAME := EriLibtool

          EriLibtool_FILES = Main.cpp
          EriLibtool_CFLAGS = -fobjc-arc -std=c++17 -Wno-error=deprecated-declarations -Wno-error=return-type -I./ -I./Includes -I./Menu -I./Il2cpp -I./imgui -I./jni

          include $(THEOS_MAKE_PATH)/tweak.mk
          include $(THEOS_MAKE_PATH)/aggregate.mk
          EOF

          if [ ! -f "control" ]; then
            cat << 'EOF' > control
          Package: com.example.erilibtool
          Name: EriLibtool
          Depends: mobilesubstrate
          Version: 0.0.1
          Architecture: iphoneos-arm
          Description: An awesome iOS tweak!
          Maintainer: Developer
          Author: Developer
          Section: Tweaks
          EOF
          fi

          export THEOS="$GITHUB_WORKSPACE/theos"
          make package

      - name: Upload DEB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-tweak-deb
          path: packages/*.deb
          retention-days: 7
